      - img "गुरु-शिष्य" [ref=e32]
      - generic [ref=e33]:
        - paragraph [ref=e34]: भारतीय शास्त्रीय संगीत की समस्त परंपरा अपने मूल में एक ही सिद्धांत पर टिकी है — गुरु-शिष्य परंपरा। ध्रुपद जैसी प्राचीन और जटिल विधा को सहस्राब्दियों तक जीवित रखने का एकमात्र साधन यही गुरुमुखी पद्धति रही है, जहाँ ज्ञान पुस्तकों से नहीं, अपितु मुख से मुख तक, हृदय से हृदय तक प्रवाहित होता है।
        - paragraph [ref=e35]: शास्त्रों में लिखा गया प्रत्येक स्वर मूर्तिमान तब होता है जब वह किसी जीवित गुरु के कंठ से निकलकर शिष्य के कानों तक पहुँचता है। यही कारण है कि ध्रुपद की चार वाणियाँ — डागर, खंडार, नौहार और गौहर — आज भी अपनी विशिष्टता बनाए हुए हैं।
        - blockquote [ref=e36]: "\"गुरु बिना गति नहीं — शास्त्र पढ़कर कोई संगीतकार नहीं बन सकता। संगीत वह विद्या है जो दीक्षा से, साधना से, और निरंतर सेवा से ही प्राप्त होती है।\" — उस्ताद ज़िया मोहिउद्दीन डागर"
        - paragraph [ref=e37]: गुरुकुल परंपरा में शिष्य वर्षों तक गुरु के सान्निध्य में रहता था। प्रारंभिक वर्षों में उसे केवल सुनने का अभ्यास कराया जाता — कान का संस्कार ही सर्वोपरि माना गया। फिर तानपुरे की संगति में षड्ज पर बैठने की कला, श्वास का अनुशासन, और स्वर के सूक्ष्म-स्पंदनों की पहचान।
        - paragraph [ref=e38]: केवल कण्ठ-साधना ही नहीं, अपितु जीवन-शैली भी गुरु के समक्ष सीखी जाती। आहार-विहार, अनुशासन, संयम, विनम्रता — ये सब संगीत-साधना के अनिवार्य अंग माने गए।
      - generic [ref=e39]:
        - img "गुरु" [ref=e41]
        - generic [ref=e42]:
          - heading "उस्ताद नसीर अमीनुद्दीन डागर" [level=4] [ref=e43]
          - generic [ref=e44]: 1923 – 2000
          - paragraph [ref=e45]: डागर वाणी के बीसवीं सदी के अग्रणी प्रतिनिधि। अपने भाई उस्ताद नसीर मोइनुद्दीन डागर के साथ "सीनियर डागर बंधुओं" के रूप में विख्यात। उनकी आलाप-शैली में मीड़ और गहन ध्यानात्मक स्वर-संचालन की विशेषता थी।
      - generic [ref=e46]:
        - paragraph [ref=e47]: आधुनिक काल में जब विश्वविद्यालयों ने संगीत-शिक्षा को संस्थागत रूप दिया, तब प्रश्न उठा — क्या यह व्यवस्था पारंपरिक गुरुकुल का स्थान ले सकती है? अनुभवी गुरुओं का मानना है कि कक्षा में स्वरों की जानकारी तो दी जा सकती है, परंतु भाव और रस का संचार केवल गुरु के साथ दीर्घ साधना से ही संभव है।
        - paragraph [ref=e48]: आज ध्रुपद की परंपरा को बचाने का प्रश्न भी इसी से जुड़ा है। भोपाल के पं. उमाकांत गुंदेचा एवं रमाकांत गुंदेचा ने 1985 में गुंदेचा गुरुकुल की स्थापना की, जहाँ देश-विदेश के अनेक शिष्य पारंपरिक रीति से ध्रुपद सीख रहे हैं।
        - blockquote [ref=e49]: "\"शिष्य का चयन गुरु करता है — पर वास्तविक शिष्य वही है जो गुरु के सम्मुख स्वयं को सर्वथा खाली रखता है। तभी संगीत का प्रवाह हो सकता है।\""
