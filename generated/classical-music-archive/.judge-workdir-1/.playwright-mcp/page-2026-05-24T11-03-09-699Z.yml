        - paragraph [ref=e59]: यही ध्रुपद की अद्भुतता है — हज़ार वर्ष पुरानी होकर भी यह आज की भी कला है, क्योंकि प्रत्येक पीढ़ी के गुरु-शिष्य ने उसे अपने जीवन से सींचा है।
