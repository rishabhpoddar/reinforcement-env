      - heading "Une pièce unique au fond d'une cour pavée du onzième arrondissement." [level=2] [ref=e13]:
        - emphasis [ref=e14]: Une pièce unique au fond d'une cour pavée du onzième arrondissement.
      - generic [ref=e15]:
        - paragraph [ref=e16]: L'atelier a ouvert en mars 2014, dans une ancienne menuiserie de la rue de Charonne. Trois grandes tables de chêne, deux cuves de marbrage, une presse typographique des années 1950 récupérée à Vichy — et beaucoup de patience.
        - paragraph [ref=e17]: "Au début, Margaux travaillait seule. Aujourd'hui l'équipe compte quatre artisanes formées au marbrage à la cuve et à la reliure traditionnelle. Le rythme reste lent : on ne marbre que les matins, quand la lumière entre par les fenêtres nord."
      - generic [ref=e18]:
        - paragraph [ref=e19]: Chaque pièce qui sort de l'atelier est numérotée, signée à la mine de plomb au verso, et accompagnée d'une note précisant le bain utilisé et la date de fabrication.
        - paragraph [ref=e20]: Nous travaillons exclusivement avec du papier de Moulin Richard de Bas en Auvergne, et des pigments naturels broyés à Montrouge. Rien d'industriel, rien de pressé.
    - generic [ref=e21]:
      - img "Portrait de Margaux Lefèvre, fondatrice" [ref=e22]
      - generic [ref=e23]:
        - blockquote [ref=e24]: « J'ai d'abord été relieuse, puis le papier marbré m'est revenu, presque sans que je le décide. C'est une matière qui exige le silence — et qui répond à celui qui sait attendre. »
        - generic [ref=e25]:
          - strong [ref=e26]: Margaux Lefèvre
          - text: · fondatrice, marbrière
