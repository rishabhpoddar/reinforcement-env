          - heading "Lenteur" [level=3] [ref=e42]
          - paragraph [ref=e43]: Rien ne se fabrique en une journée. Le séchage d'une feuille de marbrure demande quarante-huit heures — nous n'essayons pas d'aller plus vite.
        - generic [ref=e44]:
          - generic [ref=e45]: "02"
          - heading "Matière" [level=3] [ref=e46]
          - paragraph [ref=e47]: Papier d'Auvergne, pigments minéraux, fil de lin, encres végétales. Nous connaissons l'origine de chaque composant que nous employons.
        - generic [ref=e48]:
