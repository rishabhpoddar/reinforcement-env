      - heading "Nos valeurs" [level=2] [ref=e37]
      - generic [ref=e38]:
        - generic [ref=e39]:
          - generic [ref=e40]: "01"
          - heading "Lenteur" [level=3] [ref=e41]
          - paragraph [ref=e42]: Rien ne se fabrique en une journée. Le séchage d'une feuille de marbrure demande quarante-huit heures — nous n'essayons pas d'aller plus vite.
        - generic [ref=e43]:
          - generic [ref=e44]: "02"
          - heading "Matière" [level=3] [ref=e45]
          - paragraph [ref=e46]: Papier d'Auvergne, pigments minéraux, fil de lin, encres végétales. Nous connaissons l'origine de chaque composant que nous employons.
        - generic [ref=e47]:
          - generic [ref=e48]: "03"
          - heading "Geste" [level=3] [ref=e49]
          - paragraph [ref=e50]: Le peigne, la cuve, la presse. Des gestes lents, répétés depuis cinq siècles, transmis d'atelier en atelier. Nous y ajoutons notre note.
