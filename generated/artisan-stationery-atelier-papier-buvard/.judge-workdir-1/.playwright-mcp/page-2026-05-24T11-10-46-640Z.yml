    - generic [ref=e11]:
      - heading "Une pièce unique au fond d'une cour pavée du onzième arrondissement." [level=2] [ref=e12]:
        - emphasis [ref=e13]: Une pièce unique au fond d'une cour pavée du onzième arrondissement.
      - generic [ref=e14]:
        - paragraph [ref=e15]: L'atelier a ouvert en mars 2014, dans une ancienne menuiserie de la rue de Charonne. Trois grandes tables de chêne, deux cuves de marbrage, une presse typographique des années 1950 récupérée à Vichy — et beaucoup de patience.
        - paragraph [ref=e16]: "Au début, Margaux travaillait seule. Aujourd'hui l'équipe compte quatre artisanes formées au marbrage à la cuve et à la reliure traditionnelle. Le rythme reste lent : on ne marbre que les matins, quand la lumière entre par les fenêtres nord."
      - generic [ref=e17]:
        - paragraph [ref=e18]: Chaque pièce qui sort de l'atelier est numérotée, signée à la mine de plomb au verso, et accompagnée d'une note précisant le bain utilisé et la date de fabrication.
        - paragraph [ref=e19]: Nous travaillons exclusivement avec du papier de Moulin Richard de Bas en Auvergne, et des pigments naturels broyés à Montrouge. Rien d'industriel, rien de pressé.
    - generic [ref=e20]:
      - img "Portrait de Margaux Lefèvre, fondatrice" [ref=e21]
      - generic [ref=e22]:
        - blockquote [ref=e23]: « J'ai d'abord été relieuse, puis le papier marbré m'est revenu, presque sans que je le décide. C'est une matière qui exige le silence — et qui répond à celui qui sait attendre. »
        - generic [ref=e24]:
          - strong [ref=e25]: Margaux Lefèvre
          - text: · fondatrice, marbrière
