          - generic [ref=e26]: "01"
          - heading "Index Scope and Lane Eligibility" [level=2] [ref=e27]
          - paragraph [ref=e28]: Meridian observes containerized freight prices across port pairs where quote density, sailing frequency, and equipment availability meet minimum thresholds.
          - paragraph [ref=e29]: Each lane is evaluated daily against source diversity, timestamp freshness, and movement relevance before entering the composite index.
          - generic [ref=e30]: “A freight index is only useful when its exclusions are as clear as its headline number.”
        - generic [ref=e32]:
          - generic [ref=e33]: "02"
          - heading "Data Collection Methadology" [level=2] [ref=e34]
          - paragraph [ref=e35]: Inputs include verified forwarder quotes, carrier tariff filings, booking confirmations, port dwell metrics, schedule reliability, and bunker fuel reference prices.
          - paragraph [ref=e36]: Outlier observations are quarantined when they diverge from lane-specific volatility envelopes without supporting source corroboration.
          - figure [ref=e37]:
            - img "Shipping containers detail" [ref=e38]
        - generic [ref=e39]:
          - generic [ref=e40]: "03"
          - heading "Normalization and Weighting" [level=2] [ref=e41]
          - paragraph [ref=e42]: Rate observations are converted into comparable USD per FEU values by equipment type, surcharge treatment, and validity window.
          - paragraph [ref=e43]: Composite values weight dense, recent, multi-source observations above isolated spot quotes that do not reflect executable market depth.
