      - text: / About
    - heading "We Believe in Slow Food , Loud Flavors." [level=1] [ref=e23]:
      - text: We Believe in
      - generic [ref=e24]: Slow Food
      - text: ", Loud Flavors."
    - paragraph [ref=e25]: A magazine and an archive, devoted to the strange, ancient, and stubbornly delicious craft of fermentation.
  - generic [ref=e26]:
    - generic [ref=e27]:
      - paragraph [ref=e28]: The Pickle Periodical was started in 2016 by three home fermenters who realized that the most exciting cookbooks they owned were paperbacks from the 1970s and the most exciting people they knew were elderly grandmothers in basements. There was a magazine missing from the world — one that took brine seriously without taking itself too seriously, one that documented techniques alongside the people who carried them across continents.
      - paragraph [ref=e29]: So we made it. Quarterly, in print and online, with a worker-owned co-op and zero outside investment. Every recipe in the vault has been tested at least twice in the same kitchen by the same set of obsessed eaters.
    - generic [ref=e30]:
      - paragraph [ref=e31]:
        - text: "We believe in three things: that"
        - emphasis [ref=e32]: time
        - text: is the most overlooked ingredient on earth, that
        - emphasis [ref=e33]: microbes
        - text: are collaborators rather than enemies, and that
        - emphasis [ref=e34]: traditional knowledge
        - text: deserves more shelf space than the latest grocery-aisle trend. We pay our writers above industry rates and credit every recipe to the person or family who taught us.
      - paragraph [ref=e35]: If you find a typo, an error, or a story we should be telling, write to us. We are small, we are listening, and we are usually hunched over a jar.
