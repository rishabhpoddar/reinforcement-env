  - article [ref=e39]:
    - generic [ref=e40]:
      - generic [ref=e41]:
        - generic [ref=e42]: "1"
        - heading "Weigh Your Vegetables" [level=3] [ref=e43]
        - paragraph [ref=e44]: Strip outer leaves, remove cores, and weigh the prepared vegetable in grams. This number is the foundation of every calculation that follows. Approximation is the enemy of safe lacto-fermentation.
      - generic [ref=e45]:
        - generic [ref=e46]: "2"
        - heading "Calculate the Salt" [level=3] [ref=e47]
        - paragraph [ref=e48]: Multiply the vegetable weight by your target salt percentage (typically 2.0–2.5% by weight). Use non-iodized salt only — pickling salt, kosher salt, or pure sea salt without anti-caking agents.
      - generic [ref=e49]:
        - text: ⚠ TROUBLESHOOTING
        - 'heading "Troubleshooting: Why is my kraut slimy?" [level=4] [ref=e50]'
        - paragraph [ref=e51]: "Slime is usually one of three culprits: too-warm ambient temperature (above 75°F), inadequate salt (below 1.8%), or the wrong cabbage cultivar. Most slime is benign — keep it submerged and ferment another week. It often resolves."
      - generic [ref=e52]:
        - generic [ref=e53]: "3"
        - heading "Mash & Knead" [level=3] [ref=e54]
        - paragraph [ref=e55]: Sprinkle salt over shredded vegetables and massage aggressively for 8–10 minutes. The salt draws water from the cells, creating the brine that will become your fermentation medium.
      - generic [ref=e58]:
        - paragraph [ref=e59]: “If your wrists aren’t tired by step three, you haven’t kneaded enough. The kraut should weep like a sad cabbage.”
        - generic [ref=e60]: — Brinemaster Sandor, on cabbage
      - generic [ref=e61]:
        - generic [ref=e62]: "4"
        - heading "Pack the Vessel" [level=3] [ref=e63]
        - paragraph [ref=e64]: Press the salted vegetable into a clean, wide-mouth jar in compressed layers. Pour any liberated brine over the top. Leave at least 2 inches of headspace below the rim.
      - heading "Salt Percentage by Vegetable" [level=3] [ref=e65]
