      - generic [ref=e98]:
        - generic [ref=e99]: "5"
        - heading "Submerge & Wait" [level=3] [ref=e100]
        - paragraph [ref=e101]: Weight the vegetables down so they remain submerged below the brine. Apply an airlock or burp the jar daily for the first week. Taste at day 7, 14, and 21 — finish when you love it.
      - generic [ref=e104]:
        - text: ⚠ TROUBLESHOOTING
        - 'heading "Bonus: White scum on top — friend or foe?" [level=4] [ref=e105]'
        - paragraph [ref=e106]: Kahm yeast. Harmless but funky-smelling. Skim with a clean spoon. Won’t hurt the ferment beneath, but if left for weeks it can soften the texture.
