      - generic [ref=e86]:
        - generic [ref=e87]: "5"
        - heading "Submerge & Wait" [level=3] [ref=e88]
        - paragraph [ref=e89]: Weight the vegetables down so they remain submerged below the brine. Apply an airlock or burp the jar daily for the first week. Taste at day 7, 14, and 21 — finish when you love it.
      - generic [ref=e92]:
        - text: ⚠ TROUBLESHOOTING
        - 'heading "Bonus: White scum on top — friend or foe?" [level=4] [ref=e93]'
        - paragraph [ref=e94]: Kahm yeast. Harmless but funky-smelling. Skim with a clean spoon. Won’t hurt the ferment beneath, but if left for weeks it can soften the texture.
