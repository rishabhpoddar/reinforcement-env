        - text: FEATURED THIS WEEK
        - generic [ref=e40]: “My jar is hissing at me. Loudly. The lid bulges, the smell is sharp, and my partner has banned it from the kitchen. Should I be excited or terrified?”
        - generic [ref=e41]: — Priya R., Toronto · 4 days ago
        - paragraph [ref=e42]:
          - strong [ref=e43]: Excited.
          - text: What you’re describing is a healthy, vigorously fermenting lacto-vegetable in stage two of its lifecycle. Hissing means CO₂ is escaping faster than your seal can release it, which is normal between days 3–7 of a kraut or kimchi ferment. The sharp smell is hydrogen sulfide and lactic acid — pungent but harmless.
        - paragraph [ref=e44]: "That said: a bulging lid is not optional. Either “burp” the jar daily by opening it briefly to release pressure, or switch to an airlock lid that does this automatically. Bulging jars can shatter in rare cases, and nobody wants kraut grenades."
        - paragraph [ref=e45]: A hissing jar is a jar making its rent. Pay attention, but trust the process.
        - generic [ref=e46]: "VERDICT: PROCEED, WITH BURPING"
