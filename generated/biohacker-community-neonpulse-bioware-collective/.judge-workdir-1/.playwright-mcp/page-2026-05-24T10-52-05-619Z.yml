      - generic [ref=e30]:
        - paragraph [ref=e31]:
          - text: 01 Somos un colectivo abierto de biohackers, ingenieras, artistas y curiosas. Vivimos en cuerpos que nadie eligió por nosotras y, sin embargo,
          - mark [ref=e32]: el cuerpo es el último territorio donde la soberanía sigue siendo posible
          - text: . Este manifiesto es un mapa, no un dogma.
        - paragraph [ref=e33]: 02 Rechazamos la idea de que la tecnología corporal pertenece a las corporaciones, a los gobiernos o a las clínicas que cobran un salario completo por una incisión de tres milímetros. La carne es código abierto y siempre lo fue.
        - paragraph [ref=e34]:
          - text: 03 No celebramos el dolor, ni el riesgo, ni la cicatriz como estética. Celebramos el conocimiento que las precede y el cuidado que las sigue.
          - mark [ref=e35]: "Antes del bisturí: la lectura. Después del bisturí: la comunidad."
        - paragraph [ref=e36]: 04 Documentar es resistir. Cada implante que se registra en nuestra base de datos pública es una pequeña victoria contra la opacidad médica y un acto de generosidad hacia quienes vendrán después.
        - paragraph [ref=e37]: 05 No vendemos datos. No los compartimos con aseguradoras, anunciantes ni estados. La encriptación no es una característica, es una postura ética.
        - paragraph [ref=e38]:
          - text: 06 Reconocemos que el biohacking en Latinoamérica e Iberia no puede copiar acríticamente al norte global.
          - mark [ref=e39]: Nuestra precariedad es también nuestra escuela
          - text: ": improvisamos con esterilización casera, intercambiamos materiales escasos y cuidamos cuando los sistemas de salud no llegan o llegan tarde."
        - paragraph [ref=e40]: "07 Distinguimos firmemente entre la autonomía corporal y el solucionismo tecnológico. Ningún chip te va a salvar de la soledad. Ningún imán te va a dar una identidad que no construyas. La tecnología subdérmica no es magia: es una herramienta más en un cuerpo histórico."
        - paragraph [ref=e41]:
          - text: "08 Nos oponemos a toda forma de coerción para implantar: jefes que exijan chips de acceso, parejas que pidan rastreadores, estados que normalicen marcas corporales obligatorias."
          - mark [ref=e42]: El consentimiento informado, libre y revocable, es innegociable.
        - paragraph [ref=e43]: 09 Apoyamos a miembros menores de edad solo en su derecho a informarse. No instalamos, no asesoramos sobre procedimientos y derivamos a redes especializadas en derechos de infancias.
        - paragraph [ref=e44]: "10 Cuidamos a quienes deciden explantarse. Quitar un implante no es un fracaso: es un acto válido del mismo derecho que lo instaló. Mantenemos guías de explante con el mismo rigor que las de instalación."
        - paragraph [ref=e45]: 11 Construimos este colectivo en mutuo apoyo, sin liderazgos vitalicios, sin marcas registradas, sin monetización. Las personas que coordinan rotan cada dos años. Las cuentas son públicas, auditables y modestas.
        - paragraph [ref=e46]:
          - text: 12 Si algún día este manifiesto deja de servir, lo reescribiremos.
          - mark [ref=e47]: La versión 3.2 es solo una pausa en una conversación que empezó antes de nosotras y seguirá después.
