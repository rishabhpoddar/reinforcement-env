    - generic [ref=e44]:
      - article [ref=e45]:
        - paragraph [ref=e46]: "Das Raster erscheint in vielen Beschreibungen als neutrales Werkzeug. Im Material des Archivs zeigt es sich jedoch als aktive Behauptung: Es bestimmt, welche Information zuerst gelesen wird, wie Nähe entsteht und an welcher Stelle ein Plakat Widerspruch zulässt."
        - heading "Ordnung" [level=2] [ref=e47]
        - paragraph [ref=e48]: Die Schweizer Gestaltung der Nachkriegszeit übersetzt gesellschaftliche Erwartungen an Klarheit in messbare Abstände. Diese Abstände sind nicht dekorativ. Sie bilden eine Grammatik der Zuverlässigkeit.
        - paragraph [ref=e49]: Ein Raster ist weniger Käfig als Vertrag zwischen Objekt, Leser:in und öffentlichem Raum.
        - heading "Dichte Passagen" [level=2] [ref=e50]
        - generic [ref=e51]:
          - paragraph [ref=e52]: "In Unterrichtsblättern von Ruder und Hofmann wird das Verhältnis von Spalte, Zeilenfall und Weissraum als Übung wiederholt. Die Wiederholung erzeugt Sicherheit, aber auch eine Ethik der Reduktion. Genau dort beginnt die historische Spannung: Was als universell gilt, ist aus konkreten Schulen, Druckereien und Auftraggebern entstanden."
          - paragraph [ref=e53]: Die Originale zeigen Korrekturen in Bleistift, abgeschnittene Probedrucke und Varianten, in denen eine Achse um wenige Millimeter verschoben wurde. Diese kleinen Entscheidungen verändern die Tonalität des gesamten Entwurfs.
