    - generic [ref=e71]:
      - paragraph [ref=e72]: Das Plakat verbindet eine strenge linksbündige Satzanlage mit einem einzigen roten Kreis, der als Orientierungspunkt und Störung zugleich funktioniert. Die Komposition zeigt exemplarisch, wie die Schweizer Gebrauchsgrafik um 1960 visuelle Hierarchie über Mass, Achse und Abstand erzeugte.
      - paragraph [ref=e73]: Die Papieroberfläche weist leichte Alterungsspuren auf. Diese Spuren sind in der Digitalisierung bewusst erhalten, weil sie Herstellung, Distribution und Lagerung als Teil der Objektgeschichte lesbar machen.
      - paragraph [ref=e74]: Bemerkenswert ist die konsequente Trennung von Informationsblock und Bildzeichen. Der Entwurf vermeidet Illustration und arbeitet stattdessen mit relationaler Spannung im Raster.
